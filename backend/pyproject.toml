[project]
name = "wealth-tracker-backend"
version = "0.1.0"
description = "Wealth Tracker API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "casparser==1.4.1",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".ruff_cache"

[tool.ruff.lint]
# Design rules (ADR 0028): small functions, one level of nesting, few arguments,
# no flag arguments, no magic values, no else after return/raise.
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "PT", "TID",
  "C90", "PL", "RET", "FBT", "ERA", "ARG", "PIE",
  "PLR1702", "PLR0914", "PLR0917",
]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 4

[tool.ruff.lint.pylint]
max-args = 3
max-positional-args = 3
max-branches = 4
max-returns = 3
max-statements = 12
max-locals = 7
max-nested-blocks = 1
max-bool-expr = 3
max-public-methods = 7

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -n auto --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: Fast unit tests that don't require external dependencies",
    "integration: Slower tests that may require external services or complex setup",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_expr = true
disallow_any_explicit = true
warn_unreachable = true
exclude = ["^\\.venv/"]
mypy_path = "stubs"

# Performance optimizations
incremental = true
cache_dir = ".mypy_cache"
sqlite_cache = true

# Test clients and assertions on response bodies are inherently Any-typed.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_expr = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
