<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — CAMS statement import experience</title>
<!--
  PROTOTYPE (v2) — throwaway. Answers one question:
  "What does importing a CAMS statement feel like, and what does the user see when it goes wrong?"
  Ticket: Design the CAMS statement import experience (wealth-tracker)

  v2 is rebuilt against the documented casparser taxonomy in docs/research/cams-parsers.md
  (gaps G1-G14), not invented warnings. Every scenario cites the gap it exercises.

  Three variants, ?variant=A|B|C. Scenario via ?scenario=...
  Not production code: no tests, no error handling, no persistence, no abstractions.
  Vocabulary follows CONTEXT.md (Account, Instrument, Scheme, Position, Transaction, Lot).

  FACT VS INFERENCE (from the research brief's own "Next steps" #1 — no hands-on parse was done):
    Documented (README/CHANGELOG/schema/issue tracker):
      G1 re-saved PDF rejected, G2 MFCentral rejected, G4 IncorrectPasswordError,
      G5 parse_warnings on balance discontinuity, G6 schemes[].isin can be null,
      G7 valuation.cost can be null, G9 MISC/UNKNOWN types incl. 1.4.0 informational rows,
      G10 per-scheme rta, G11 record parser version, v1.1.0 scheme-region-discarded warning.
    Researcher inference (medium confidence, unverified):
      G3 single-AMC => FileType.UNKNOWN; the exact shape of parse_warnings; G12 counts.
    Scenarios built on inference say so in the scenario picker.
-->
<style>
  :root{
    --bg:#f6f6f4; --panel:#fff; --ink:#1a1a18; --muted:#6b6b66; --line:#e2e2dd;
    --ok:#0f7a4d; --ok-bg:#e8f5ee; --warn:#9a6300; --warn-bg:#fdf3e0;
    --bad:#b3261e; --bad-bg:#fceceb; --info:#2f5b9e; --info-bg:#eaf1fb;
    --accent:#1a1a18; --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
  h1{font-size:19px} h2{font-size:16px} h3{font-size:14px}
  h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  p{margin:0 0 8px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .num{font-variant-numeric:tabular-nums}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:#f1f1ec; padding:1px 5px; border-radius:4px}
  button{font:inherit; cursor:pointer}
  .btn{border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:7px 13px; border-radius:8px}
  .btn:hover{background:#fafaf8}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn-primary:hover{background:#000}
  .btn-sm{padding:3px 9px; font-size:12.5px; border-radius:6px}
  .btn-ghost{border-color:transparent; background:transparent; color:var(--muted)}
  .btn-ghost:hover{background:#f0f0ec; color:var(--ink)}
  input[type=password],input[type=text]{font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 11px; background:#fff; min-width:0}
  input[type=password]:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid transparent; white-space:nowrap}
  .chip-ok{background:var(--ok-bg); color:var(--ok)}
  .chip-warn{background:var(--warn-bg); color:var(--warn)}
  .chip-bad{background:var(--bad-bg); color:var(--bad)}
  .chip-info{background:var(--info-bg); color:var(--info)}
  .chip-neutral{background:#f0f0ec; color:var(--muted)}
  .chip-typed{background:#fff; border-color:var(--line); color:var(--muted); font-family:ui-monospace,monospace; font-size:10.5px; font-weight:500; letter-spacing:.02em}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius)}
  .pad{padding:14px 16px}
  table{width:100%; border-collapse:collapse}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  tr:last-child td{border-bottom:none}
  .right{text-align:right}
  .banner{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius); border:1px solid}
  .banner-ok{background:var(--ok-bg); border-color:#bfe0cd}
  .banner-warn{background:var(--warn-bg); border-color:#eed9ae}
  .banner-bad{background:var(--bad-bg); border-color:#f0c3bf}
  .banner-info{background:var(--info-bg); border-color:#c9dcf5}
  .dropzone{border:1.5px dashed #c9c9c2; border-radius:12px; background:#fbfbf9; padding:38px 20px; text-align:center}
  .stack{display:flex; flex-direction:column; gap:12px}
  .row{display:flex; align-items:center; gap:10px}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grow{flex:1; min-width:0}
  .wrap{max-width:1080px; margin:0 auto; padding:22px 20px 130px}
  .wrap-wide{max-width:1600px; margin:0 auto; padding:18px 20px 130px}
  /* prototype chrome */
  #proto{position:fixed; left:0; right:0; bottom:12px; display:flex; justify-content:center; z-index:99; pointer-events:none}
  #proto > *{pointer-events:auto}
  .pill{background:#111; color:#fff; border-radius:999px; box-shadow:0 6px 22px rgba(0,0,0,.28); display:flex; align-items:center; gap:2px; padding:5px 7px}
  .pill button{background:transparent; color:#fff; border:none; padding:4px 9px; border-radius:999px; font-size:13px}
  .pill button:hover{background:#333}
  .pill .label{font-size:12.5px; padding:0 8px; min-width:190px; text-align:center}
  .pill .label b{font-weight:700}
  .scenarios{position:fixed; bottom:12px; left:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; box-shadow:0 4px 14px rgba(0,0,0,.08); z-index:99; font-size:12.5px; max-width:270px}
  .scenarios select{font:inherit; border:1px solid var(--line); border-radius:6px; padding:4px 6px; width:100%; margin-top:4px; background:#fff}
  .scenarios .hint{margin-top:6px; color:var(--muted); font-size:11.5px; line-height:1.45}
  .scenarios .infer{margin-top:6px; font-size:11px; color:var(--warn); border-top:1px dashed #eed9ae; padding-top:6px; line-height:1.4}
  .protobadge{position:fixed; top:12px; right:16px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; letter-spacing:.08em; padding:4px 10px; border-radius:999px; z-index:99; text-transform:uppercase}
  /* stepper */
  .steps{display:flex; align-items:center; gap:0; margin-bottom:20px}
  .step{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px}
  .step .dot{width:22px; height:22px; border-radius:50%; border:1.5px solid #cfcfc8; display:grid; place-items:center; font-size:11.5px; font-weight:700; background:var(--panel)}
  .step.done .dot{background:var(--ok); border-color:var(--ok); color:#fff}
  .step.current .dot{background:var(--accent); border-color:var(--accent); color:#fff}
  .step.current{color:var(--ink); font-weight:600}
  .stepline{flex:1; height:1.5px; background:#dcdcd6; margin:0 12px; min-width:20px}
  .sectionnum{display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:#eeeee9; font-size:11.5px; font-weight:700; flex:none}
  /* console */
  .workbench{display:grid; grid-template-columns:250px minmax(0,1fr) 310px; gap:14px; align-items:start}
  .isp{display:flex; align-items:center; gap:14px; padding:11px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); flex-wrap:wrap}
  .counter{display:flex; flex-direction:column; gap:1px; padding:0 12px; border-left:1px solid var(--line); cursor:pointer; background:none; border-top:none; border-right:none; border-bottom:none; text-align:left}
  .counter:first-of-type{border-left:none}
  .counter .v{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
  .counter .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  .counter[aria-pressed="true"] .k{color:var(--ink); font-weight:700}
  .counter[aria-pressed="true"] .v{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px}
  .treepane{font-size:12.5px}
  .rtag{font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin:10px 0 4px}
  .schem{display:flex; gap:6px; align-items:center; padding:4px 0 4px 10px; border-left:2px solid var(--line); margin-left:6px}
  .issue{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px; padding:11px 12px}
  .issue.bad{border-left-color:var(--bad)}
  .issue.info{border-left-color:var(--info)}
  .issue.ok{border-left-color:var(--ok)}
  .issue.resolved{opacity:.55}
  .stickybar{position:sticky; bottom:0; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:11px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:0 0 var(--radius) var(--radius)}
  /* inbox */
  .inboxrow{display:flex; gap:14px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line)}
  .gutter{width:6px; align-self:stretch; border-radius:3px; background:#dcdcd6; flex:none}
  .gutter.warn{background:#e0ab2d} .gutter.bad{background:#d1463c} .gutter.ok{background:#3d9a6c} .gutter.info{background:#4f7fc4}
  .meter{height:5px; border-radius:3px; background:#e6e6e1; overflow:hidden; min-width:110px}
  .meter > i{display:block; height:100%; background:var(--accent)}
  .triageitem{display:flex; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:8px; background:var(--panel)}
  .triageitem.done{background:#fbfdfb; border-color:#cfe6da}
  .choices{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .choice{border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 10px; font-size:12.5px; display:flex; gap:6px; align-items:center}
  .choice:hover{background:#f7f7f4}
  .choice.sel{background:var(--accent); color:#fff; border-color:var(--accent)}
  .lockbox{display:flex; gap:20px; align-items:flex-start; padding:18px}
  .lockicon{width:44px; height:44px; border-radius:10px; background:#f0f0ec; display:grid; place-items:center; font-size:20px; flex:none}
  .fielderr{color:var(--bad); font-size:12.5px; margin-top:7px}
  .tick{list-style:none; padding:0; margin:6px 0 0}
  .tick li{display:flex; gap:8px; font-size:12.5px; color:var(--muted); padding:2px 0}
  .tick li::before{content:"·"; color:var(--muted)}
  details.prov{margin-top:12px}
  details.prov summary{cursor:pointer; font-size:12.5px; color:var(--muted)}
  details.prov .body{margin-top:6px; font-family:ui-monospace,monospace; font-size:11.5px; line-height:1.8; color:var(--muted)}
</style>
</head>
<body>
<div class="protobadge">Prototype v2</div>
<div id="app"></div>

<div class="scenarios">
  <label class="small" style="font-weight:600" for="scen">Scenario</label>
  <select id="scen"></select>
  <div class="hint" id="scenhint"></div>
  <div class="infer" id="sceninfer" style="display:none"></div>
</div>

<div id="proto">
  <div class="pill">
    <button id="prev" title="Previous variant (left arrow)">&lsaquo;</button>
    <span class="label" id="vlabel"></span>
    <button id="next" title="Next variant (right arrow)">&rsaquo;</button>
  </div>
</div>

<script>
/* ================================================================== *
 * Helpers
 * ================================================================== */
const inr = n => "₹" + new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const u3  = n => new Intl.NumberFormat("en-IN",{minimumFractionDigits:3,maximumFractionDigits:3}).format(n);
const dmy = iso => { const [y,m,d] = iso.split("-"); return d+" "+["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m]+" "+y; };

/* Transaction taxonomy — casparser's documented 17-value enum (G9).
   classify() decides what the ledger does with each, which is the thing
   the user actually needs to see. */
const LEDGER = ["PURCHASE","PURCHASE_SIP","REDEMPTION","SWITCH_IN","SWITCH_IN_MERGER",
                "SWITCH_OUT","SWITCH_OUT_MERGER","GIFT_IN","GIFT_OUT","REVERSAL","SEGREGATION"];
const INCOME = ["DIVIDEND_PAYOUT","DIVIDEND_REINVEST"];
const CHARGE = ["STT_TAX","STAMP_DUTY_TAX","TDS_TAX"];
const classify = t => LEDGER.includes(t) ? "ledger"
                     : INCOME.includes(t) ? "income"
                     : CHARGE.includes(t) ? "charge"
                     : t === "MISC" ? "info"
                     : "unknown";
const MEANING = {
  ledger:"changes units or cost", income:"value without changing units",
  charge:"a charge against the Position", info:"a note, not a movement",
  unknown:"we don't know what this does",
};

/* ================================================================== *
 * Invented holdings. Nothing here is a real statement.
 * ================================================================== */
const HOLDINGS = {
  ppfcf:{ name:"Parag Parikh Flexi Cap Fund – Direct Growth", rta:"CAMS",     rtaCode:"PPFCF", amfi:"122639", isin:"INF879O01027", folio:"12345/67", nav:78.42 },
  hdfc:{ name:"HDFC Balanced Advantage Fund – Direct Growth", rta:"CAMS",     rtaCode:"HDFCBAF", amfi:"118989", isin:"INF179K01YV8", folio:"12345/67", nav:512.30 },
  icici:{name:"ICICI Prudential Corporate Bond Fund – Direct Growth", rta:"KFINTECH", rtaCode:"ICICICB", amfi:"120648", isin:null, folio:"98765/43", nav:28.914 },
  quant:{name:"Quant Small Cap Fund – Direct Growth",         rta:"KFINTECH", rtaCode:"QUANTSC", amfi:"120828", isin:"INF966L01689", folio:"98765/43", nav:264.18 },
};

/* A Scheme as the parser hands it over, plus what our ledger derives. */
function scheme(key, o){
  const h = HOLDINGS[key];
  const close = o.close, derived = o.derived ?? o.close;
  return { key, ...h, open:o.open, close, derived,
    closeCalculated:o.closeCalculated ?? close,
    valuationCost:o.valuationCost ?? null,
    lots:o.lots ?? 1, txns:o.txns ?? [],
    note:o.note ?? "",
    status: Math.abs(derived-close) < 0.0015 ? "match" : "mismatch",
    delta: +(derived-close).toFixed(3) };
}
const txn = (date,type,description,amount,units,nav,balance) =>
  ({date,type,description,amount,units,nav,balance,kind:classify(type)});

/* ================================================================== *
 * Scenarios — each cites the gap it exercises (docs/research/cams-parsers.md)
 * ================================================================== */
const SCENARIOS = {

  "first-import":{
    label:"First import (documented)",
    hint:"G4 password step, G5 balance warning, G9 UNKNOWN + informational MISC rows, G6 a Scheme with no ISIN, G7 derived cost basis, G10 two registrars in one file.",
    files:[{name:"CAS_2026-09-15.pdf", size:"412 KB", pages:18, status:"parsed",
            fileType:"CAMS", parserVersion:"1.4.1", hash:"a3f19c2e…",
            kind:"Consolidated Account (Detailed)"}],
    locked:false,
    statementTotals:{schemes:4, folios:2},
    schemes:[
      scheme("ppfcf",{ open:1000.000, close:1234.567, derived:1234.567, valuationCost:87410.00, lots:3, txns:[
        txn("2026-04-20","PURCHASE_SIP","SIP instalment",5000.00,66.140,75.60,1066.140),
        txn("2026-05-20","PURCHASE_SIP","SIP instalment",5000.00,64.881,77.06,1131.021),
        txn("2026-06-15","DIVIDEND_PAYOUT","IDCW payout",412.00,null,null,null),
        txn("2026-07-01","MISC","***Registration of Nominee***",null,null,null,null),
        txn("2026-08-20","PURCHASE","Lumpsum",8000.00,103.546,77.26,1234.567),
      ]}),
      scheme("hdfc",{ open:840.000, close:890.123, derived:892.123, valuationCost:288410.55, lots:4, txns:[
        txn("2026-04-12","SWITCH_IN","Switch in from 98765/43",25200.00,52.123,483.47,892.123),
        txn("2026-05-05","STAMP_DUTY_TAX","Stamp duty",0.50,null,null,891.999),
      ]}),
      scheme("icici",{ open:3420.000, close:3420.000, derived:3420.000, valuationCost:97885.88, lots:1, txns:[
        txn("2026-04-02","PURCHASE","Lumpsum",97885.88,3420.000,28.622,3420.000),
      ]}),
      scheme("quant",{ open:215.000, close:215.000, derived:215.000, valuationCost:0, lots:1, txns:[
        txn("2026-06-01","MISC","***KYC address update***",null,null,null,null),
      ]}),
    ],
    warnings:[
      {kind:"balance", scheme:"hdfc", text:"Transactions for this Scheme do not reconcile with the running unit balance printed in the statement. 2.000 units unaccounted for after the 2026-04-12 switch-in."}
    ],
    discarded:[],
    unknown:[
      {scheme:"ppfcf", date:"2026-09-02", description:"TRF FROM 98765/43", amount:2500.00, units:33.370, nav:74.92, page:9},
    ],
    informational:[
      {scheme:"ppfcf", date:"2026-07-01", description:"***Registration of Nominee***", page:7},
      {scheme:"quant", date:"2026-06-01", description:"***KYC address update***", page:14},
    ],
    duplicates:{skipped:0, sample:[]},
    openingBalances:[
      {scheme:"ppfcf", units:1000.000, date:"2026-04-01", note:"statement starts mid-life"},
      {scheme:"hdfc", units:840.000, date:"2026-04-01", note:"statement starts mid-life"},
      {scheme:"icici", units:3420.000, date:"2026-04-02", note:"statement starts mid-life"},
      {scheme:"quant", units:215.000, date:"2026-03-18", note:"statement starts mid-life"},
    ],
    rejected:[],
    counts:{parsedSchemes:4, parsedFolios:2},
    inference:false,
  },

  "password":{
    label:"Password-protected, wrong first",
    hint:"G4. CAS PDFs arrive password-protected. First attempt returns IncorrectPasswordError; the second succeeds — without asking the user to upload the file again.",
    files:[{name:"CAS_2026-09-15.pdf", size:"412 KB", pages:18, status:"locked",
            fileType:"CAMS", parserVersion:"1.4.1", hash:"a3f19c2e…",
            kind:"Consolidated Account (Detailed)"}],
    locked:true,
    statementTotals:{schemes:3, folios:2},
    schemes:[
      scheme("ppfcf",{ open:1000.000, close:1234.567, derived:1234.567, valuationCost:87410.00, lots:3, txns:[
        txn("2026-04-20","PURCHASE_SIP","SIP instalment",5000.00,66.140,75.60,1066.140),
      ]}),
      scheme("hdfc",{ open:840.000, close:890.123, derived:890.123, valuationCost:288410.55, lots:4, txns:[
        txn("2026-04-12","SWITCH_IN","Switch in from 98765/43",25200.00,50.123,483.47,890.123),
      ]}),
      scheme("icici",{ open:3420.000, close:3420.000, derived:3420.000, valuationCost:97885.88, lots:1, txns:[] }),
    ],
    warnings:[], discarded:[], unknown:[], informational:[],
    duplicates:{skipped:0, sample:[]},
    openingBalances:[
      {scheme:"ppfcf", units:1000.000, date:"2026-04-01", note:"statement starts mid-life"},
      {scheme:"hdfc", units:840.000, date:"2026-04-01", note:"statement starts mid-life"},
      {scheme:"icici", units:3420.000, date:"2026-04-02", note:"statement starts mid-life"},
    ],
    rejected:[],
    counts:{parsedSchemes:3, parsedFolios:2},
    inference:false,
  },

  "reimport":{
    label:"Reimport (documented)",
    hint:"ADR 0006 — an overlapping statement reimported. Transactions already in the ledger are skipped rather than doubled.",
    files:[{name:"CAS_2026-12-15.pdf", size:"428 KB", pages:19, status:"parsed",
            fileType:"CAMS", parserVersion:"1.4.1", hash:"7b02dd41…", kind:"Consolidated Account (Detailed)"}],
    locked:false,
    statementTotals:{schemes:4, folios:2},
    schemes:[
      scheme("ppfcf",{ open:1234.567, close:1350.401, derived:1350.401, valuationCost:87410.00, lots:3, txns:[
        txn("2026-10-20","PURCHASE_SIP","SIP instalment",5000.00,62.114,80.50,1296.681),
        txn("2026-11-20","PURCHASE_SIP","SIP instalment",5000.00,53.720,93.07,1350.401),
      ]}),
      scheme("hdfc",{ open:890.123, close:892.123, derived:894.123, valuationCost:288410.55, lots:5, txns:[
        txn("2026-10-08","PURCHASE","Lumpsum",10000.00,18.940,528.00,909.063),
      ]}),
      scheme("icici",{ open:3420.000, close:3420.000, derived:3420.000, valuationCost:97885.88, lots:1, txns:[] }),
      scheme("quant",{ open:215.000, close:215.000, derived:215.000, valuationCost:0, lots:1, txns:[] }),
    ],
    warnings:[
      {kind:"balance", scheme:"hdfc", text:"Same imbalance as the earlier import — 2.000 units still unaccounted for after the 2026-04-12 switch-in."}
    ],
    discarded:[],
    unknown:[],
    informational:[],
    duplicates:{skipped:14, sample:[
      {date:"2026-09-20", scheme:"Parag Parikh Flexi Cap", type:"PURCHASE_SIP", amount:5000.00},
      {date:"2026-10-20", scheme:"Parag Parikh Flexi Cap", type:"PURCHASE_SIP", amount:5000.00},
      {date:"2026-11-20", scheme:"Parag Parikh Flexi Cap", type:"PURCHASE_SIP", amount:5000.00},
    ]},
    openingBalances:[],
    rejected:[],
    counts:{parsedSchemes:4, parsedFolios:2},
    inference:false,
  },

  "rejected":{
    label:"Three kinds of rejected file",
    hint:"G1 re-saved PDF, G2 MFCentral, G3 single-AMC — three genuinely different errors, not one generic failure. A real CAS is still needed for any of them to be useful.",

/* ================================================================== *
 * Model + shared prototype state
 * ================================================================== */
function model(sc){
  const s = SCENARIOS[sc];
  const schemes = s.schemes;
  const mismatched = schemes.filter(x=>x.status==="mismatch");
  const parseable = s.files.filter(f=>f.status.startsWith("parsed"));
  const rejected = s.files.filter(f=>f.status==="rejected");
  const locked = s.files.filter(f=>f.status==="locked");
  const rtaCount = new Set(schemes.map(x=>x.rta)).size;
  const noIsin = schemes.filter(x=>!x.isin);
  const unverified = schemes.filter(x=> s.warnings.some(w=>w.kind==="balance" && w.scheme===x.key));
  // The warning carries the message; the located detail (page, anchor) sits alongside it.
  const discarded = s.warnings.filter(w=>w.kind==="discarded")
    .map((w,i)=>({...w, ...((s.discarded||[])[i]||{})}));
  const countGap = Math.max(0, s.statementTotals.schemes - s.counts.parsedSchemes);
  const txnCount = schemes.reduce((a,x)=>a+x.txns.filter(t=>t.kind!=="info").length,0);
  const costKnown = schemes.filter(x=>x.valuationCost!==null).length;
  const totalOpen = s.openingBalances.reduce((a,o)=>a+o.units,0);
  return { ...s, sc, schemes, mismatched, parseable, rejected, locked, rtaCount, noIsin, unverified,
    discarded, countGap, txnCount, costKnown, totalOpen,
    openCount: mismatched.length + s.unknown.length + discarded.length + rejected.length + countGap,
  };
}

const DECISIONS = {};
const dk = (sc,k) => sc + "::" + k;
const labels = {
  "ledger":"recorded as a ledger Transaction", "income":"recorded as Income",
  "info":"recorded as a note, no effect on units", "exclude":"left out of this import",
  "flag":"flagged for you to check later", "raw":"raw statement line shown",
  "trust-ledger":"trusted our ledger", "trust-statement":"trusted the statement",
  "opening":"booked as an opening balance", "skip-scheme":"not imported",
  "ack":"acknowledged", "reimport":"asked for a fresh statement",
  "review":"reviewed after import", "exclude-scheme":"left out of this import",
};

/* ================================================================== *
 * Shared fragments
 * ================================================================== */
function provDetails(m, indent){
  return `<details class="prov">
    <summary>Technical details for this import</summary>
    <div class="body">
      ${m.files.map(f=>`${f.name} · ${f.size} · ${f.pages} pages<br>&nbsp;&nbsp;issuer ${f.fileType} · ${f.kind} · read with casparser ${f.parserVersion}${f.hash?` · ${f.hash}`:""}`).join("<br>")}
      <br>&nbsp;&nbsp;${m.schemes.length} Schemes · ${m.rtaCount} registrar${m.rtaCount>1?"s":""} · ${m.counts.parsedFolios} folios
    </div>
  </details>`;
}

function fileChip(f){
  const map = {parsed:["chip-ok","parsed"], "parsed-with-warnings":["chip-warn","parsed, with warnings"],
               rejected:["chip-bad","not usable"], locked:["chip-info","locked"]};
  const [cls,txt] = map[f.status] || ["chip-neutral",f.status];
  return `<span class="chip ${cls}">${txt}</span>`;
}

/* Password block — G4. Rendered by each variant in its own place. */
function passwordBlock(m, onSubmitted){
  const st = DECISIONS[dk(m.sc,"pw")] || "idle";
  const err = st === "wrong";
  if (st === "ok") return `<div class="banner banner-ok"><div class="grow">
      <div class="row" style="gap:8px;margin-bottom:2px"><b>Unlocked</b><span class="chip chip-ok">read successfully</span></div>
      <p class="small muted" style="margin:0">The statement opened with the password you gave. It has not been kept and has not left this machine.</p>
    </div></div>`;
  return `<div class="card">
    <div class="lockbox">
      <div class="lockicon">&#128274;</div>
      <div class="grow">
        <h3 style="margin-bottom:3px">This statement is password-protected</h3>
        <p class="small muted" style="margin-bottom:12px">
          CAS files always arrive locked. <span class="mono">${m.files[0].name}</span> needs its password before anything can be read.
        </p>
        <div class="row">
          <input id="pw" type="password" placeholder="Statement password" style="flex:1; min-width:220px"
                 onkeydown="if(event.key==='Enter')submitPw('${m.sc}')">
          <button class="btn btn-primary" onclick="submitPw('${m.sc}')">Unlock</button>
        </div>
        ${err ? `<div class="fielderr">That password didn't open the file. Nothing was read and nothing was written — try again, no need to upload it twice.</div>` : ""}
        <ul class="tick">
          <li>Commonly the PAN in capitals, or the PAN in lower case followed by your date of birth — but it can be anything you chose.</li>
          <li>We never store it, never show it back, and never send it anywhere.</li>
        </ul>
      </div>
    </div>
  </div>`;
}

/* ============================== VARIANT A ============================== *
 * Guided review — a linear stepper. One column, narrow measure, numbered
 * sections in sequence, gated by a Continue button. Now five sections,
 * which is itself a finding.
 * ====================================================================== */
function A({m}){
  const sc = m.sc;
  if (m.locked.length && !m.parseable.length) {
    return `<div class="wrap">${steps(2)}
      <h1 style="margin-bottom:4px">Unlock this statement</h1>

  }
  if (!m.schemes.length) {
    return `<div class="wrap">${steps(2)}

            <p class="small" style="margin:0 0 6px">${f.reason}</p>
            <p class="small muted" style="margin:0">${f.fix||""}</p>
            <details class="prov"><summary>Technical details</summary><div class="body">${f.fileType} · read with casparser ${f.parserVersion}</div></details>
          </div></div>`).join("")}
        <div class="row" style="justify-content:space-between; margin-top:4px">
          <button class="btn" onclick="resetDecisions()">Try another file</button>
          <span class="small muted">Nothing was written. No statement left this machine.</span>

  const sec = [];
  sec.push(`<div class="card pad"><div class="row" style="gap:10px; align-items:flex-start">

      <div class="row-between" style="margin-bottom:2px">

        ${m.mismatched.length ? `<span class="chip chip-warn">${m.mismatched.length} of ${m.schemes.length} disagree</span>`
                              : `<span class="chip chip-ok">all ${m.schemes.length} agree</span>`}
      </div>
      <p class="small muted" style="margin-bottom:12px">The statement prints closing holdings. We rebuild each Position from its Transactions and compare — a disagreement is yours to settle, never accepted silently.</p>
      ${rtaGroups(m, s=>`
        <tr>
          <td><div>${s.name}</div>
              <div class="small muted">${s.isin ? `ISIN ${s.isin}` : `no ISIN — identified by AMFI code ${s.amfi}`} · folio ${s.folio}</div></td>
          <td class="right num">${u3(s.close)}</td>
          <td class="right num">${u3(s.derived)}</td>
          <td class="right num">${s.status==="match" ? `<span class="chip chip-ok">0.000</span>` : `<b style="color:var(--warn)">${s.delta>0?"+":""}${u3(s.delta)}</b>`}</td>
          <td class="small muted">${s.valuationCost===null ? "not printed — derived" : inr(s.valuationCost)}</td>
        </tr>`)}
      ${m.noIsin.length ? `<p class="small muted" style="margin-top:10px">
        <b>${m.noIsin.length} Scheme${m.noIsin.length>1?"s":""} came back without an ISIN</b>, which is normal for some folios. They are keyed by registrar and AMFI code instead, so they still import — but price lookups may not match until an ISIN is known.</p>` : ""}
    </div></div></div>`);

  const unverifiedBlock = m.discarded.length || m.unverified.length || m.countGap;
  if (unverifiedBlock) {
    sec.push(`<div class="card pad"><div class="row" style="gap:10px; align-items:flex-start">
      <div class="sectionnum">2</div><div class="grow">
        <div class="row-between" style="margin-bottom:4px">
          <h3>Unverified</h3>

        <div class="stack" style="gap:10px">
          ${m.discarded.map(d=>`

          <div class="row" style="gap:8px; margin-bottom:4px"><b>Original PDF</b><span class="chip chip-neutral">undecided</span></div>
          <p class="small muted" style="margin:0">Whether the PDF is kept, and whether it's encrypted, belongs with the privacy and security posture. This prototype doesn't settle it.</p>
        </div></div>
      </div>
      ${provDetails(m)}
    </div></div></div>`);

  return `<div class="wrap">${steps(3)}
    <h1 style="margin-bottom:4px">Review this statement</h1>
    <p class="muted" style="margin-bottom:20px">
      <span class="mono">${m.files.filter(f=>f.status.startsWith("parsed")).map(f=>f.name).join(", ")}</span>
      · ${m.schemes.length} Schemes across ${m.counts.parsedFolios} folios · ${m.rtaCount} registrar${m.rtaCount>1?"s":""}
    </p>
    <div class="stack">${sec.join("")}
      <div class="row-between" style="margin-top:6px">
        <button class="btn btn-ghost" onclick="resetDecisions()">Start over</button>
        <div class="row">
          <span class="small muted">${m.txnCount} Transactions · ${m.schemes.length} Schemes · ${m.openingBalances.length} opening balances</span>
          <button class="btn btn-primary" onclick="commit()">Import ${m.txnCount} Transactions</button>
        </div>
      </div>
    </div></div>`;
}

function steps(current){
  const labels = ["Choose file","Unlock","Review","Import"];
  return `<div class="steps">${labels.map((l,i)=>{
    const n = i+1, cls = n<current?"done":n===current?"current":"";
    return `<div class="step ${cls}"><div class="dot">${n<current?"✓":n}</div><span>${l}</span></div>` + (i<labels.length-1?`<div class="stepline"></div>`:"");
  }).join("")}</div>`;
}

/* group the reconciliation table by registrar (G10) */
function rtaGroups(m, rowFn){
  const byRta = {};
  m.schemes.forEach(s => (byRta[s.rta] = byRta[s.rta] || []).push(s));
  const keys = Object.keys(byRta);
  const head = `<thead><tr><th>Scheme</th><th class="right">Statement says</th><th class="right">Our ledger</th><th class="right">Difference</th><th>Cost basis</th></tr></thead>`;
  if (keys.length === 1) return `<table>${head}<tbody>${m.schemes.map(rowFn).join("")}</tbody></table>`;
  return keys.map(r=>`
    <div class="rtag" style="margin-top:14px">${r} — ${byRta[r].length} Scheme${byRta[r].length>1?"s":""}</div>
    <table>${head}<tbody>${byRta[r].map(rowFn).join("")}</tbody></table>`).join("");
}

                :`<div class="choices">

            ${m.unverified.map(s=>`
              <div class="issue ${DECISIONS[dk(sc,"un-"+s.key)]?"resolved":""}">

                <div class="small">${s.name.split(" – ")[0]}</div>

                ${DECISIONS[dk(sc,"un-"+s.key)]?`<div class="small" style="color:var(--ok)">✓ ${labels[DECISIONS[dk(sc,"un-"+s.key)]]} <button class="btn btn-sm btn-ghost" onclick="pick('${sc}','un-${s.key}','')">undo</button></div>`
                :`<div class="choices">

                    <button class="choice" onclick="pick('${sc}','un-${s.key}','trust-statement')">Statement</button>
                    <button class="choice" onclick="pick('${sc}','un-${s.key}','exclude-scheme')">Leave out</button>

            ${m.unknown.map((r,i)=>`
              <div class="issue ${DECISIONS[dk(sc,"u"+i)]?"resolved":""}">
                <div class="row-between" style="margin-bottom:4px">
                  <b class="small">What is this row?</b><span class="chip chip-typed">UNKNOWN</span>

        </div>
        <div class="row">
          <button class="btn btn-ghost" onclick="resetDecisions()">Reset</button>
          <button class="btn btn-primary" onclick="commit()" ${!m.schemes.length?"disabled":""}>Commit import</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================== VARIANT C ============================== *
 * Import inbox — the import is an event with an audit trail. Problems are
 * items to triage; the import commits when its inbox is empty.
 * ====================================================================== */
function C({m}){
  const sc = m.sc;
  const items = [];
  m.discarded.forEach(d=>items.push({k:"disc", kind:"discarded", d}));
  m.unverified.forEach(s=>items.push({k:"un-"+s.key, kind:"warning", s}));
  m.unknown.forEach((r,i)=>items.push({k:"u"+i, kind:"unknown", r, i}));
  if (m.countGap) items.push({k:"count", kind:"count"});
  m.rejected.forEach((f,i)=>items.push({k:"r"+i, kind:"rejected", f}));
  const resolved = items.filter(it=>DECISIONS[dk(sc,it.k)]).length;
  const total = items.length;
  const ready = !!m.schemes.length && (total===0 || resolved===total);

  const history = [
    {name:"CAS_2026-06-15.pdf", when:"15 Sep 2026", txns:8, state:"committed", detail:"2 opening balances seeded · 1 warning accepted"},
    ...(m.duplicates.skipped?[{name:"CAS_2026-09-15.pdf", when:"15 Sep 2026", txns:5, state:"committed", detail:`${m.duplicates.skipped} Transactions already present, skipped`}]:[]),
  ];

  return `<div class="wrap">
    <div class="row-between" style="margin-bottom:16px">
      <div>
        <h1>Imports</h1>
        <p class="muted small" style="margin:0">Every statement you've brought in, and what it changed. ${m.files.length} file${m.files.length>1?"s":""} waiting.</p>
      </div>
      <button class="btn">Choose statement…</button>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="inboxrow" style="background:#fcfcfa">
        <div class="gutter ${!m.schemes.length?"bad":(total&&resolved<total)?"warn":"ok"}"></div>
        <div class="grow">
          <div class="row" style="gap:8px; margin-bottom:2px">
            <b>${m.files.map(f=>f.name).join(", ")}</b>
            ${!m.schemes.length?`<span class="chip chip-bad">nothing to import</span>`
              : total&&resolved<total?`<span class="chip chip-warn">needs review</span>`
              : `<span class="chip chip-ok">ready to import</span>`}
          </div>
          <div class="muted small">Just now · ${m.files.length} file${m.files.length>1?"s":""} · ${m.txnCount} Transactions</div>
        </div>
        ${total?`<div style="text-align:right">
          <div class="small num"><b>${resolved}</b> of ${total} resolved</div>
          <div class="meter" style="margin-top:5px"><i style="width:${Math.round(resolved/total*100)}%"></i></div>
        </div>`:""}
      </div>

      <div class="pad" style="border-top:1px solid var(--line)">
        ${m.locked.length && !m.schemes.length ? passwordBlock(m) : ""}

        ${!m.schemes.length ? `
          <div class="banner banner-bad" style="margin-bottom:12px"><div class="grow">
            <div class="row" style="gap:8px; margin-bottom:6px"><b>None of these files could be read</b><span class="chip chip-bad">${m.rejected.length}</span></div>
            ${m.files.map(f=>`<div class="small" style="margin-bottom:6px"><b class="mono">${f.name}</b> — ${f.reason} <span class="muted">${f.fix||""}</span></div>`).join("")}
            <p class="small muted" style="margin:8px 0 0">Nothing was written; your ledger is unchanged.</p>
          </div></div>` : `
          <div class="row-between" style="margin-bottom:12px">
            <div>
              <h3>Review items</h3>
              <p class="small muted" style="margin:0">The import is held until every item is triaged. Nothing reaches the ledger before then.</p>
            </div>
            <span class="chip ${resolved===total?"chip-ok":"chip-warn"}">${resolved} / ${total} triaged</span>
          </div>
          <div class="stack" style="gap:10px">
            ${items.map(it=>triageItem(m,it)).join("") || `<div class="banner banner-ok"><div class="grow"><b>Nothing to review</b><p class="small muted" style="margin:2px 0 0">Every Scheme tied out against the statement.</p></div></div>`}
          </div>`}

        ${m.schemes.length ? `
        <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line)">
          <h4 style="margin-bottom:8px">What this import will write</h4>
          <table><tbody>
            <tr><td class="small">Transactions</td><td class="right num"><b>${m.txnCount}</b></td><td class="small muted">new entries in the ledger</td></tr>
            <tr><td class="small">Schemes</td><td class="right num"><b>${m.schemes.length}</b></td><td class="small muted">across ${m.counts.parsedFolios} folios and ${m.rtaCount} registrar${m.rtaCount>1?"s":""}</td></tr>
            <tr><td class="small">Notes kept</td><td class="right num"><b>${m.informational.length}</b></td><td class="small muted">nominee, KYC and similar rows — no effect on units</td></tr>
            <tr><td class="small">Transactions skipped</td><td class="right num"><b>${m.duplicates.skipped}</b></td><td class="small muted">already in your ledger from an earlier import</td></tr>
            <tr><td class="small">Opening balances seeded</td><td class="right num"><b>${m.openingBalances.length}</b></td><td class="small muted">dated, and kept distinct from real Transactions</td></tr>
            <tr><td class="small">Schemes without an ISIN</td><td class="right num"><b>${m.noIsin.length}</b></td><td class="small muted">keyed by registrar and AMFI code instead</td></tr>
          </tbody></table>
        </div>
        <div class="row-between" style="margin-top:14px">
          <div class="small muted">Original PDF retention: undecided — belongs with the privacy and security posture.</div>
          <div class="row">
            <button class="btn btn-ghost" onclick="resetDecisions()">Discard</button>
            <button class="btn btn-primary" onclick="commit()" ${!ready?"disabled":""}>
              ${ready ? "Commit import" : `Triage ${total-resolved} more`}
            </button>
          </div>
        </div>` : ""}
      </div>
    </div>

    ${history.length?`<h4 style="margin-bottom:8px">Earlier imports</h4>
    <div class="card">${history.map(h=>`
      <div class="inboxrow">
        <div class="gutter ok"></div>
        <div class="grow">
          <div class="row" style="gap:8px; margin-bottom:2px"><b class="mono" style="font-size:13px">${h.name}</b><span class="chip chip-ok">${h.state}</span></div>
          <div class="muted small">${h.when} · ${h.txns} Transactions · ${h.detail}</div>
        </div>
        <button class="btn btn-sm">Open</button>
      </div>`).join("")}</div>`:""}
  </div>`;
}

function triageItem(m,it){
  const sc = m.sc, chosen = DECISIONS[dk(sc,it.k)];
  const undo = `<button class="btn btn-sm btn-ghost" onclick="pick('${sc}','${it.k}','')">change</button>`;

  if (it.kind === "discarded"){
    const d = it.d;
    return `<div class="triageitem ${chosen?"done":""}">
      <span class="chip ${chosen?"chip-ok":"chip-bad"}">${chosen?"✓":"✕"}</span>
      <div class="grow">
        <div class="row-between"><b class="small">A whole Scheme is missing from this import</b><span class="chip chip-bad">page ${d.page}</span></div>
        <p class="small muted" style="margin:5px 0 0">${d.text} The statement prints ${m.statementTotals.schemes} Schemes and ${m.counts.parsedSchemes} were read, so one is absent entirely — not mismatched, absent.</p>
        ${chosen?`<div class="small" style="color:var(--ok); margin-top:8px">${labels[chosen]} ${undo}</div>`
        :`<div class="choices">
            <button class="choice" onclick="pick('${sc}','${it.k}','reimport')">Get a fresh statement</button>
            <button class="choice" onclick="pick('${sc}','${it.k}','review')">Import the rest and flag it</button>
          </div>`}
      </div></div>`;
  }
  if (it.kind === "warning"){
    const s = it.s, w = m.warnings.find(x=>x.scheme===s.key);
    return `<div class="triageitem ${chosen?"done":""}">
      <span class="chip ${chosen?"chip-ok":"chip-warn"}">${chosen?"✓":"!"}</span>
      <div class="grow">
        <div class="row-between"><b class="small">Figures may be incomplete — ${s.name}</b><span class="chip chip-warn">${u3(s.delta)} units</span></div>
        <div class="small muted" style="margin:3px 0 0">${s.isin?`ISIN ${s.isin}`:`no ISIN · AMFI ${s.amfi}`} · folio ${s.folio}</div>
        <p class="small" style="margin:5px 0 0">${w.text} The statement prints <b class="num">${u3(s.close)}</b>; our ledger has <b class="num">${u3(s.derived)}</b>.</p>
        ${chosen?`<div class="small" style="color:var(--ok); margin-top:8px">${labels[chosen]} ${undo}</div>`
        :`<div class="choices">
            <button class="choice" onclick="pick('${sc}','${it.k}','trust-ledger')">Trust our ledger</button>
            <button class="choice" onclick="pick('${sc}','${it.k}','trust-statement')">Trust the statement</button>
            <button class="choice" onclick="pick('${sc}','${it.k}','exclude-scheme')">Leave this Scheme out</button>
          </div>`}
      </div></div>`;
  }
  if (it.kind === "unknown"){
    const r = it.r;
    return `<div class="triageitem ${chosen?"done":""}">
      <span class="chip ${chosen?"chip-ok":"chip-warn"}">${chosen?"✓":"!"}</span>
      <div class="grow">
        <div class="row-between"><b class="small">What is this row?</b><span class="chip chip-typed">UNKNOWN</span></div>
        <div class="small muted" style="margin:3px 0 0">${HOLDINGS[r.scheme].name} · ${dmy(r.date)} · page ${r.page}</div>
        <p class="small" style="margin:5px 0 0">${inr(r.amount)} · ${u3(r.units)} units at ₹${r.nav}. The statement calls it <code>${r.description}</code>, and gives no clue which movement it is. We won't guess — an unplaced row is never treated as a purchase or a redemption by itself.</p>
        ${chosen?`<div class="small" style="color:var(--ok); margin-top:8px">${labels[chosen]} ${undo}</div>`
        :`<div class="choices">
            <button class="choice" onclick="pick('${sc}','${it.k}','ledger')">A purchase or redemption</button>
            <button class="choice" onclick="pick('${sc}','${it.k}','info')">Only a note</button>
            <button class="choice" onclick="pick('${sc}','${it.k}','exclude')">Leave it out</button>
          </div>`}
      </div></div>`;
  }
  if (it.kind === "count"){
    return `<div class="triageitem ${chosen?"done":""}">
      <span class="chip ${chosen?"chip-ok":"chip-warn"}">${chosen?"✓":"!"}</span>
      <div class="grow">
        <div class="row-between"><b class="small">Fewer Schemes than the statement's own footer</b><span class="chip chip-warn">${m.countGap} short</span></div>
        <p class="small muted" style="margin:5px 0 0">The footer totals ${m.statementTotals.schemes} Schemes; ${m.counts.parsedSchemes} were read. Worth scrolling the statement before importing.</p>
        ${chosen?`<div class="small" style="color:var(--ok); margin-top:8px">${labels[chosen]} ${undo}</div>`
        :`<div class="choices">
            <button class="choice" onclick="pick('${sc}','${it.k}','review')">I've checked — carry on</button>
            <button class="choice" onclick="pick('${sc}','${it.k}','reimport')">Get a fresh statement</button>
          </div>`}
      </div></div>`;
  }
  const f = it.f;
  return `<div class="triageitem ${chosen?"done":""}">
    <span class="chip ${chosen?"chip-ok":"chip-bad"}">${chosen?"✓":"✕"}</span>
    <div class="grow">
      <div class="row-between"><b class="small">File not usable — ${f.kind}</b><span class="chip chip-bad">not read</span></div>
      <div class="mono muted small" style="word-break:break-all; margin:3px 0 0">${f.name}</div>
      <p class="small" style="margin:5px 0 0">${f.reason} ${f.fix||""} ${m.schemes.length?"The other files import normally.":"Nothing to import."}</p>
      ${chosen?`<div class="small" style="color:var(--ok); margin-top:8px">${labels[chosen]||"acknowledged"} ${undo}</div>`
      :`<div class="choices">
          <button class="choice" onclick="pick('${sc}','${it.k}','ack')">Acknowledge</button>
          <button class="choice" onclick="pick('${sc}','${it.k}','reimport')">I'll get the right file</button>
        </div>`}
    </div></div>`;
}

/* ================================================================== *
 * Chrome
 * ================================================================== */
const VARIANTS = [
  ["A", "Guided review — linear stepper"],
  ["B", "Import console — one dense screen"],
  ["C", "Import inbox — triage queue"],
];

let current = { variant: new URLSearchParams(location.search).get("variant") || "A",
                scenario: new URLSearchParams(location.search).get("scenario") || "first-import" };

function setUrl(){
  const p = new URLSearchParams();
  p.set("variant", current.variant); p.set("scenario", current.scenario);
  history.replaceState(null,"","?"+p.toString());
}
function resetDecisions(){ Object.keys(DECISIONS).forEach(k=>delete DECISIONS[k]); render(); }
function pick(sc,k,v){
  if (DECISIONS[dk(sc,k)] === v) delete DECISIONS[dk(sc,k)];
  else if (v) DECISIONS[dk(sc,k)] = v;
  else delete DECISIONS[dk(sc,k)];
  render();
}
function setFilter(sc,f){ DECISIONS[dk(sc,"__filter")] = f; render(); }
function submitPw(sc){
  // Simulates G4: the first attempt raises IncorrectPasswordError; the second succeeds.
  if (DECISIONS[dk(sc,"pw")] === "wrong") DECISIONS[dk(sc,"pw")] = "ok";
  else DECISIONS[dk(sc,"pw")] = "wrong";
  render();
}
function commit(){
  const m = model(current.scenario);
  alert("PROTOTYPE\n\nWould commit " + m.txnCount + " Transactions across " + m.schemes.length +
        " Schemes, keep " + m.informational.length + " notes, skip " + m.duplicates.skipped +
        " already-imported Transactions and seed " + m.openingBalances.length + " opening balances.\n\n" +
        "No database exists. Nothing happened.");
}
function render(){
  const m = model(current.scenario);
  const app = document.getElementById("app");
  // clear any typed password on re-render
  const focused = document.activeElement && document.activeElement.id;
  app.innerHTML = current.variant==="A" ? A({m}) : current.variant==="B" ? B({m}) : C({m});
  if (focused === "pw"){ const el = document.getElementById("pw"); if (el) el.focus(); }
  const v = VARIANTS.find(x=>x[0]===current.variant);
  document.getElementById("vlabel").innerHTML = `<b>${v[0]}</b> — ${v[1].split("—")[1].trim()}`;
  const sel = document.getElementById("scen");
  sel.value = current.scenario;
  const s = SCENARIOS[current.scenario];
  document.getElementById("scenhint").textContent = s.hint;
  const inf = document.getElementById("sceninfer");
  if (s.inference){ inf.style.display="block"; inf.textContent = "Built partly on inference: " + (s.inferNote||""); }
  else inf.style.display = "none";
  setUrl();
}
function cycle(dir){
  const i = VARIANTS.findIndex(x=>x[0]===current.variant);
  current.variant = VARIANTS[(i+dir+VARIANTS.length)%VARIANTS.length][0];
  render();
}
document.getElementById("next").onclick = ()=>cycle(1);
document.getElementById("prev").onclick = ()=>cycle(-1);
const sel = document.getElementById("scen");
Object.entries(SCENARIOS).forEach(([k,v])=>{ const o=document.createElement("option"); o.value=k; o.textContent=v.label; sel.appendChild(o); });
sel.onchange = e => { current.scenario = e.target.value; render(); };
document.addEventListener("keydown", e=>{
  const t = document.activeElement;
  if (t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable)) return;
  if (e.key==="ArrowRight") cycle(1);
  if (e.key==="ArrowLeft") cycle(-1);
});
render();
</script>
