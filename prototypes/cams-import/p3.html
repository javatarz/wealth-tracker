<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE p3 — CAMS import: parse progress, commit flow, review hierarchy</title>
<style>
  :root{
    --bg:#f6f6f4; --panel:#fff; --ink:#1a1a18; --muted:#6b6b66; --line:#e2e2dd;
    --ok:#0f7a4d; --ok-bg:#e8f5ee; --warn:#9a6300; --warn-bg:#fdf3e0;
    --bad:#b3261e; --bad-bg:#fceceb; --info:#2f5b9e; --info-bg:#eaf1fb;
    --accent:#1a1a18; --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
  h1{font-size:19px} h2{font-size:16px} h3{font-size:14px}
  h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  p{margin:0 0 8px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .num{font-variant-numeric:tabular-nums}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:#f1f1ec; padding:1px 5px; border-radius:4px}
  button{font:inherit; cursor:pointer}
  .btn{border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:7px 13px; border-radius:8px}
  .btn:hover{background:#fafaf8}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn-primary:hover{background:#000}
  .btn-sm{padding:3px 9px; font-size:12.5px; border-radius:6px}
  .btn-ghost{border-color:transparent; background:transparent; color:var(--muted)}
  .btn-ghost:hover{background:#f0f0ec; color:var(--ink)}
  .btn-lg{padding:10px 22px; font-size:15px; border-radius:10px}
  .btn-success{background:var(--ok); color:#fff; border-color:var(--ok)}
  .btn-success:hover{background:#0b663e}
  input[type=password],input[type=text]{font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 11px; background:#fff; min-width:0}
  input[type=password]:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid transparent}
  .chip-ok{background:var(--ok-bg); color:var(--ok)}
  .chip-warn{background:var(--warn-bg); color:var(--warn)}
  .chip-bad{background:var(--bad-bg); color:var(--bad)}
  .chip-info{background:var(--info-bg); color:var(--info)}
  .chip-neutral{background:#f0f0ec; color:var(--muted)}
  .chip-typed{background:#fff; border-color:var(--line); color:var(--muted); font-family:ui-monospace,monospace; font-size:10.5px; font-weight:500; letter-spacing:.02em}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius)}
  .pad{padding:14px 16px}
  table{width:100%; border-collapse:collapse}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line)}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  tr:last-child td{border-bottom:none}
  .right{text-align:right}
  .banner{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius); border:1px solid}
  .banner-ok{background:var(--ok-bg); border-color:#bfe0cd}
  .banner-warn{background:var(--warn-bg); border-color:#eed9ae}
  .banner-bad{background:var(--bad-bg); border-color:#f0c3bf}
  .banner-info{background:var(--info-bg); border-color:#c9dcf5}
  .dropzone{border:1.5px dashed #c9c9c2; border-radius:12px; background:#fbfbf9; padding:38px 20px; text-align:center}
  .stack{display:flex; flex-direction:column; gap:12px}
  .row{display:flex; align-items:center; gap:10px}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grow{flex:1; min-width:0}
  .wrap{max-width:1080px; margin:0 auto; padding:22px 20px 130px}
  #proto{position:fixed; left:0; right:0; bottom:12px; display:flex; justify-content:center; z-index:99; pointer-events:none}
  #proto > *{pointer-events:auto}
  .pill{background:#111; color:#fff; border-radius:999px; box-shadow:0 6px 22px rgba(0,0,0,.28); display:flex; align-items:center; gap:2px; padding:5px 7px}
  .pill button{background:transparent; color:#fff; border:none; padding:4px 9px; border-radius:999px; font-size:13px}
  .pill button:hover{background:#333}
  .pill .label{font-size:12.5px; padding:0 8px; min-width:210px; text-align:center}
  .pill .label b{font-weight:700}
  .scenarios{position:fixed; bottom:12px; left:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; box-shadow:0 4px 14px rgba(0,0,0,.08); z-index:99; font-size:12.5px; max-width:270px}
  .scenarios select{font:inherit; border:1px solid var(--line); border-radius:6px; padding:4px 6px; width:100%; margin-top:4px; background:#fff}
  .scenarios .hint{margin-top:6px; color:var(--muted); font-size:11.5px; line-height:1.45}
  .protobadge{position:fixed; top:12px; right:16px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; letter-spacing:.08em; padding:4px 10px; border-radius:999px; z-index:99; text-transform:uppercase}
  .steps{display:flex; align-items:center; gap:0; margin-bottom:20px; flex-wrap:wrap}
  .step{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px}
  .step .dot{width:22px; height:22px; border-radius:50%; border:1.5px solid #cfcfc8; display:grid; place-items:center; font-size:11.5px; font-weight:700; background:var(--panel); flex:none}
  .step.done .dot{background:var(--ok); border-color:var(--ok); color:#fff}
  .step.current .dot{background:var(--accent); border-color:var(--accent); color:#fff}
  .step.current{color:var(--ink); font-weight:600}
  .stepline{flex:1; height:1.5px; background:#dcdcd6; margin:0 12px; min-width:20px}
  .gutter{width:6px; align-self:stretch; border-radius:3px; background:#dcdcd6; flex:none}
  .gutter.warn{background:#e0ab2d} .gutter.bad{background:#d1463c} .gutter.ok{background:#3d9a6c} .gutter.info{background:#4f7fc4}
  .meter{height:5px; border-radius:3px; background:#e6e6e1; overflow:hidden; min-width:110px}
  .meter > i{display:block; height:100%; background:var(--accent); transition:width .3s}
  .choices{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .choice{border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 10px; font-size:12.5px; display:flex; gap:6px; align-items:center}
  .choice:hover{background:#f7f7f4}
  .choice.sel{background:var(--accent); color:#fff; border-color:var(--accent)}
  .tick{list-style:none; padding:0; margin:6px 0 0}
  .tick li{display:flex; gap:8px; font-size:12.5px; color:var(--muted); padding:2px 0}
  .tick li::before{content:"\b7"; color:var(--muted)}
  details.prov{margin-top:12px}
  details.prov summary{cursor:pointer; font-size:12.5px; color:var(--muted)}
  details.prov .body{margin-top:6px; font-family:ui-monospace,monospace; font-size:11.5px; line-height:1.8; color:var(--muted)}
  .accent-line{border-left:4px solid; border-radius:4px}
  .accent-line.bad{border-left-color:var(--bad)} .accent-line.warn{border-left-color:var(--warn)} .accent-line.info{border-left-color:var(--info)}
  .bottom-sheet{position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:20px 24px 24px; z-index:90; box-shadow:0 -8px 30px rgba(0,0,0,.12); max-width:580px; margin:0 auto}
  .bottom-sheet .bar{width:36px; height:4px; border-radius:2px; background:#dcdcd6; margin:0 auto 14px}
  .popover{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.18); z-index:91; max-width:420px; width:calc(100% - 40px)}
  .overlay{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.18); z-index:90}
  .sticky{position:sticky; bottom:0; z-index:10}
  .card.bad{border-color:var(--bad)} .card.warn{border-color:var(--warn)} .card.ok{border-color:var(--ok)} .card.info{border-color:var(--info)}
  @keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
  @keyframes slideUp{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  @keyframes slideDown{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes checkPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
  .anim-pop{animation:pop .2s ease-out}
  .anim-slide{animation:slideUp .25s ease-out}
  .anim-fade{animation:fadeIn .3s ease-out}
  .anim-slideDown{animation:slideDown .25s ease-out}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  .check-anim{animation:checkPop .35s ease-out}
  .lockicon{width:44px; height:44px; border-radius:10px; background:#f0f0ec; display:grid; place-items:center; font-size:20px; flex:none}
  .lockbox{display:flex; gap:20px; align-items:flex-start; padding:18px}
  .fielderr{color:var(--bad); font-size:12.5px; margin-top:7px}
  .rtag{font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin:10px 0 4px}
  .sticky-footer{position:sticky; bottom:0; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-radius:0 0 var(--radius) var(--radius); margin-top:12px}
  .resolve-line{padding:12px 14px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--panel)}
  .resolve-line.done{background:#fbfdfb; border-color:#cfe6da}
  .summary-table td{padding:6px 10px; font-size:12.5px}
  .summary-table td:first-child{font-weight:600}
  .summary-table td:last-child{color:var(--muted)}
  .file-row{display:flex; gap:8px; align-items:center; padding:6px 0}
  .acc-item{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .acc-header{display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; user-select:none}
  .acc-header:hover{background:#fafaf8}
  .acc-body{padding:12px 14px; border-top:1px solid var(--line)}

  /* Variant A specific */
  .parse-card-full{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .parse-card-full.fail{border-color:var(--bad)}
  .parse-card-full.done{border-color:#bfe0cd}
  .parse-card-full .red-gutter{width:6px;background:var(--bad);flex:none}
  .parse-card-full .pbar-lg{height:10px;border-radius:5px;background:#e6e6e1;overflow:hidden}
  .parse-card-full .pbar-lg i{display:block;height:100%;background:var(--accent);transition:width .5s;border-radius:5px}
  .parse-card-full .pbar-lg i.fail{background:var(--bad)}
  .status-icon-lg{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
  .status-icon-lg.spin{background:#f0f0ec}
  .status-icon-lg.done{background:var(--ok-bg);color:var(--ok)}
  .status-icon-lg.fail{background:var(--bad-bg);color:var(--bad)}
  .review-tier-red{border:1.5px solid var(--bad);border-radius:12px;overflow:hidden}
  .review-tier-red .tier-head{background:var(--bad-bg);padding:14px 16px;border-bottom:1.5px solid var(--bad)}
  .review-tier-amber{border:1.5px solid var(--warn);border-radius:12px;overflow:hidden}
  .review-tier-amber .tier-head{background:var(--warn-bg);padding:14px 16px;border-bottom:1.5px solid var(--warn)}
  .review-tier-gray{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .review-tier-gray .tier-head{background:#fbfbf9;padding:14px 16px;border-bottom:1px solid var(--line)}
  .review-item-card{border-left:4px solid;border-radius:8px;padding:14px;background:var(--panel);margin-bottom:10px}
  .review-item-card.bad{border-left-color:var(--bad)}
  .review-item-card.warn{border-left-color:var(--warn)}
  .review-item-card.info{border-left-color:var(--info)}
  .commit-full-card{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
  .commit-full-card .commit-head{padding:22px 24px 16px;text-align:center}
  .commit-full-card .commit-body{padding:0 24px 20px}
  .commit-full-card .commit-foot{padding:16px 24px 20px;background:#fbfbf9;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end}
  .success-banner-lg{background:var(--ok-bg);border:1.5px solid #bfe0cd;border-radius:14px;padding:22px 24px;text-align:center}
  .success-banner-lg .check-circle{width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
  .page-counter{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
  .error-panel{background:var(--bad-bg);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;margin-top:8px}
  .error-panel .fix-line{color:var(--bad);font-weight:600;font-size:13px}
  .error-panel .fix-sugg{color:var(--ink);font-size:12.5px;margin-top:4px}

  /* Variant B specific */
  .dash-grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.dash-grid{grid-template-columns:1fr 1fr}}
  .dash-full{grid-column:1/-1}
  .file-strip-row{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
  .file-card-mini{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:190px;max-width:220px;flex:none}
  .file-card-mini.fail{border-color:var(--bad);background:var(--bad-bg)}
  .file-card-mini.done{border-color:#bfe0cd}
  .file-card-mini .icon-box{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex:none}
  .file-card-mini .icon-box.parse{background:var(--info-bg);color:var(--info)}
  .file-card-mini .icon-box.done{background:var(--ok-bg);color:var(--ok)}
  .file-card-mini .icon-box.fail{background:var(--bad-bg);color:var(--bad)}
  .decision-pill{background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;color:var(--muted);cursor:pointer}
  .decision-pill:hover{background:#f7f7f4}
  .decision-pill.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .commit-bar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-top:20px;z-index:10;border-radius:0}
  .commit-bar.success{background:var(--ok-bg);border-color:#bfe0cd}
  .rejection-badge{font-size:10.5px;color:var(--bad);margin-top:2px;line-height:1.35}
  .severity-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px}
  .severity-badge.critical{background:var(--bad-bg);color:var(--bad)}
  .severity-badge.warning{background:var(--warn-bg);color:var(--warn)}

  /* Variant C specific */
  .wiz-layout{display:flex;min-height:calc(100vh - 40px)}
  .wiz-sidebar{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .wiz-sidebar .step-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:var(--muted);border-left:3px solid transparent}
  .wiz-sidebar .step-item.active{color:var(--ink);font-weight:600;background:#f8f8f6;border-left-color:var(--accent)}
  .wiz-sidebar .step-item.done{color:var(--ok)}
  .wiz-sidebar .step-icon{width:22px;height:22px;border-radius:50%;border:1.5px solid #cfcfc8;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--panel)}
  .wiz-sidebar .step-item.done .step-icon{background:var(--ok);border-color:var(--ok);color:#fff}
  .wiz-sidebar .step-item.active .step-icon{background:var(--accent);border-color:var(--accent);color:#fff}
  .wiz-content{flex:1;padding:22px 28px 140px;max-width:820px}
  .feed-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .feed-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);animation:fadeIn .3s ease-out}
  .feed-item:last-child{border-bottom:none}
  .feed-item.fail{background:var(--bad-bg)}
  .feed-icon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}
  .feed-icon.done{background:var(--ok-bg);color:var(--ok)}
  .feed-icon.fail{background:var(--bad-bg);color:var(--bad)}
  .feed-icon.pending{background:#f0f0ec;color:var(--muted)}
  .decision-card-lg{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);margin-bottom:14px;position:relative;transition:all .3s}
  .decision-card-lg.done{background:#fbfdfb;border-color:#cfe6da}
  .decision-card-lg .dc-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .decision-card-lg.done .dc-head{border-bottom-color:#cfe6da}
  .decision-card-lg .dc-body{padding:14px 16px}
  .decision-card-lg .dc-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:40px;color:var(--ok);z-index:2;border-radius:12px}
  .drawer-backdrop{position:fixed;top:0;left:330px;right:0;bottom:0;background:rgba(0,0,0,.24);z-index:88;animation:fadeIn .2s ease-out}
  @media(max-width:750px){.drawer-backdrop{left:0}}
  .import-drawer{position:fixed;bottom:0;left:330px;right:0;background:var(--panel);border-radius:16px 16px 0 0;padding:20px 24px 24px;z-index:89;box-shadow:0 -8px 30px rgba(0,0,0,.14);animation:slideUp .25s ease-out}
  @media(max-width:750px){.import-drawer{left:0}}
  .overall-progress{height:8px;border-radius:4px;background:#e6e6e1;overflow:hidden;margin-bottom:14px}
  .overall-progress i{display:block;height:100%;background:var(--accent);transition:width .5s;border-radius:4px}
</style>
</head>
<body>
<div class="protobadge">Prototype p3</div>
<div id="app"></div>
<div class="scenarios">
  <label class="small" style="font-weight:600" for="scen">Scenario</label>
  <select id="scen"></select>
  <div class="hint" id="scenhint"></div>
</div>

<script>
/* ================================================================== *
 * Helpers
 * ================================================================== */
const inr = n => "\u20b9" + new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const u3  = n => new Intl.NumberFormat("en-IN",{minimumFractionDigits:3,maximumFractionDigits:3}).format(n);
const dmy = iso => { const [y,m,d] = iso.split("-"); return d+" "+["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m]+" "+y; };
const LEDGER = ["PURCHASE","PURCHASE_SIP","REDEMPTION","SWITCH_IN","SWITCH_IN_MERGER",
                "SWITCH_OUT","SWITCH_OUT_MERGER","GIFT_IN","GIFT_OUT","REVERSAL","SEGREGATION"];
const INCOME = ["DIVIDEND_PAYOUT","DIVIDEND_REINVEST"];
const CHARGE = ["STT_TAX","STAMP_DUTY_TAX","TDS_TAX"];
const classify = t => LEDGER.includes(t) ? "ledger"
                     : INCOME.includes(t) ? "income"
                     : CHARGE.includes(t) ? "charge"
                     : t === "MISC" ? "info"
                     : "unknown";
const MEANING = {
  ledger:"changes units or cost", income:"value without changing units",
  charge:"a charge against the Position", info:"a note, not a movement",
  unknown:"we don't know what this does",
};

/* ================================================================== *
 * Holdings
 * ================================================================== */
const HOLDINGS = {
  ppfcf:{ name:"Parag Parikh Flexi Cap Fund \u2013 Direct Growth", rta:"CAMS",     rtaCode:"PPFCF", amfi:"122639", isin:"INF879O01027", folio:"12345/67", nav:78.42 },
  hdfc:{ name:"HDFC Balanced Advantage Fund \u2013 Direct Growth", rta:"CAMS",     rtaCode:"HDFCBAF", amfi:"118989", isin:"INF179K01YV8", folio:"12345/67", nav:512.30 },
  icici:{name:"ICICI Prudential Corporate Bond Fund \u2013 Direct Growth", rta:"KFINTECH", rtaCode:"ICICICB", amfi:"120648", isin:null, folio:"98765/43", nav:28.914 },
  quant:{name:"Quant Small Cap Fund \u2013 Direct Growth",         rta:"KFINTECH", rtaCode:"QUANTSC", amfi:"120828", isin:"INF966L01689", folio:"98765/43", nav:264.18 },
};

/* ================================================================== *
 * Model + shared prototype state
 * ================================================================== */
function model(sc){
  const s = SCENARIOS[sc];
  const schemes = s.schemes;
  const mismatched = schemes.filter(x=>x.status==="mismatch");
  const parseable = s.files.filter(f=>f.status.startsWith("parsed") && !f.parseFails);
  const parseFailed = s.files.filter(f=>f.parseFails);
  const rejected = s.files.filter(f=>f.status==="rejected");
  const locked = s.files.filter(f=>f.status==="locked");
  const rtaCount = new Set(schemes.map(x=>x.rta)).size;
  const noIsin = schemes.filter(x=>!x.isin);
  const unverified = schemes.filter(x=> s.warnings.some(w=>w.kind==="balance" && w.scheme===x.key));
  const discarded = s.warnings.filter(w=>w.kind==="discarded")
    .map((w,i)=>({...w, ...((s.discarded||[])[i]||{})}));
  const countGap = Math.max(0, s.statementTotals.schemes - s.counts.parsedSchemes);
  const txnCount = schemes.reduce((a,x)=>a+x.txns.filter(t=>t.kind!=="info").length,0);
  const costKnown = schemes.filter(x=>x.valuationCost!==null).length;
  const totalOpen = s.openingBalances.reduce((a,o)=>a+o.units,0);
  return { ...s, sc, schemes, mismatched, parseable, parseFailed, rejected, locked, rtaCount, noIsin, unverified,
    discarded, countGap, txnCount, costKnown, totalOpen,
    openCount: mismatched.length + s.unknown.length + discarded.length + rejected.length + countGap,
  };
}

function fileChip(f){
  const map = {parsed:["chip-ok","parsed"], "parsed-with-warnings":["chip-warn","parsed, with warnings"],
               rejected:["chip-bad","not usable"], locked:["chip-info","locked"]};
  if (f.parseFails) return '<span class="chip chip-bad">parse failed</span>';
  const [cls,txt] = map[f.status] || ["chip-neutral",f.status];
  return '<span class="chip '+cls+'">'+txt+'</span>';
}

function passwordBlock(m){
  const st = DECISIONS[dk(m.sc,"pw")] || "idle";
  const err = st === "wrong";
  if (st === "ok") return '<div class="banner banner-ok"><div class="grow">'+
      '<div class="row" style="gap:8px;margin-bottom:2px"><b>Unlocked</b><span class="chip chip-ok">read successfully</span></div>'+
      '<p class="small muted" style="margin:0">The statement opened with the password you gave. It has not been kept and has not left this machine.</p>'+
    '</div></div>';
  return '<div class="card">'+
    '<div class="lockbox">'+
      '<div class="lockicon">&#128274;</div>'+
      '<div class="grow">'+
        '<h3 style="margin-bottom:3px">This statement is password-protected</h3>'+
        '<p class="small muted" style="margin-bottom:12px">'+
          'CAS files always arrive locked. <span class="mono">'+m.files[0].name+'</span> needs its password before anything can be read.'+
        '</p>'+
        '<div class="row">'+
          '<input id="pw" type="password" placeholder="Statement password" style="flex:1; min-width:220px"'+
                 ' onkeydown="if(event.key===\'Enter\')submitPw(\''+m.sc+'\')">'+
          '<button class="btn btn-primary" onclick="submitPw(\''+m.sc+'\')">Unlock</button>'+
        '</div>'+
        (err ? '<div class="fielderr">That password didn\'t open the file. Nothing was read and nothing was written \u2014 try again.</div>' : "")+
        '<ul class="tick">'+
          '<li>Commonly the PAN in capitals, or the PAN in lower case followed by your date of birth.</li>'+
          '<li>We never store it, never show it back, and never send it anywhere.</li>'+
        '</ul>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function rtaGroups(m, rowFn){
  const byRta = {};
  m.schemes.forEach(s => (byRta[s.rta] = byRta[s.rta] || []).push(s));
  const keys = Object.keys(byRta);
  const head = '<thead><tr><th>Scheme</th><th class="right">Statement says</th><th class="right">Our ledger</th><th class="right">Difference</th><th>Cost basis</th></tr></thead>';
  if (keys.length === 1) return '<table>'+head+'<tbody>'+m.schemes.map(rowFn).join("")+'</tbody></table>';
  return keys.map(r=>'<div class="rtag" style="margin-top:14px">'+r+' \u2014 '+byRta[r].length+' Scheme'+(byRta[r].length>1?"s":"")+'</div>'+
    '<table>'+head+'<tbody>'+byRta[r].map(rowFn).join("")+'</tbody></table>').join("");
}

const ASYNC = {};
function dispatch(update){
  const key = current.variant + "::" + current.scenario;
  ASYNC[key] = {...ASYNC[key], ...update};
  render();
}

/* ================================================================== *
 * Simulated async parsing
 * ================================================================== */
function simulateParsing(m, variantKey, onFileDone, onAllDone){
  const key = current.variant + "::" + current.scenario;
  const files = m.files.filter(f => f.status === "parsed" || f.parseFails);
  const init = files.map(f => ({
    name: f.name,
    pages: f.pages,
    progress: 0,
    status: "waiting",
    schemesRead: 0,
    failReason: f.parseFails ? f.failReason : null,
    willFail: !!f.parseFails,
  }));
  dispatch({ parseState: { files: init, complete: false } });

  files.forEach((f, fi) => {
    const delay = f.parseFails ? 800 : 500;
    const steps = f.parseFails ? 8 : 6;
    let step = 0;
    const tick = () => {
      step++;
      const pct = Math.min(100, Math.round(step / steps * 100));
      const cur = ASYNC[current.variant + "::" + current.scenario];
      if (!cur || !cur.parseState) return;
      const updated = [...cur.parseState.files];
      if (f.parseFails && step >= steps) {
        updated[fi] = {...updated[fi], progress: pct, status: "failed"};
        dispatch({ parseState: {...cur.parseState, files: updated} });
        onFileDone(fi, false);
        return;
      }
      const schemesSoFar = !f.parseFails && pct >= 50 ? Math.ceil(pct / 25) : 0;
      updated[fi] = {...updated[fi], progress: pct, status: "parsing", schemesRead: schemesSoFar};
      dispatch({ parseState: {...cur.parseState, files: updated} });

      if (step < steps) {
        setTimeout(tick, delay);
      } else {
        const fin = [...updated];
        fin[fi] = {...fin[fi], progress: 100, status: "done", schemesRead: m.schemes.length};
        const allDone = fin.every(f2 => f2.status === "done" || f2.status === "failed");
        dispatch({ parseState: {...cur.parseState, files: fin, complete: allDone} });
        onFileDone(fi, true);
        if (allDone) onAllDone();
      }
    };
    setTimeout(tick, 100 + fi * 200);
  });
}


/* ================================================================== *

function C(m){
  const sc = m.sc;

  const doneState = cState.doneState;
  const feedDone = cState.feedDone;

  function gatherItems(){
    const items = [];
    m.discarded.forEach(d => items.push({type:"discarded", d, sortKey:0}));
    m.rejected.forEach(f => items.push({type:"rejected", f, sortKey:1}));
    m.unknown.forEach((r,i) => items.push({type:"unknown", r, i, sortKey:2}));
    m.unverified.forEach(s => items.push({type:"unverified", s, w: m.warnings.find(x=>x.scheme===s.key), sortKey:3}));
    if (m.countGap) items.push({type:"countGap", sortKey:4});
    items.sort((a,b) => a.sortKey - b.sortKey);
    return items;
  }

  function sidebar(countInfo){

      {label:"Files chosen", detail: m.files.length+' file'+(m.files.length!==1?'s':''), done:step>1, active:step===1},
      {label:"Unlock", detail: m.locked.length ? 'locked' : '', done:step>2||(step===2&&!m.locked.length), active:step===2},
      {label:"Parse", done:feedDone, active:step===3, progress: feedDone?'\u2713':''},
      {label:"Decisions", detail: feedDone ? gatherItems().filter(it=>!!DECISIONS[dk(sc,it.type==="discarded"?"disc":it.type==="unknown"?"u"+it.i:it.type==="unverified"?"un-"+it.s.key:it.type==="countGap"?"count":it.type==="rejected"?"rej-"+it.f.name:"")]).length+'/'+gatherItems().length+' resolved' : '', done:step>4, active:step===4},
      {label:"Import", done:!!doneState, active:step===5},
    ];
    return '<div class="wiz-sidebar">'+
      steps.map((s,i) => {
        const icon = s.done ? '\u2713' : (s.active ? '\u25CF' : (i+1)+'');
        return '<div class="step-item '+(s.active?'active':s.done?'done':'')+'">'+
          '<div class="step-icon">'+icon+'</div>'+
          '<div class="grow"><div>'+s.label+'</div>'+(s.detail?'<div class="small" style="color:var(--muted)">'+s.detail+'</div>':'')+'</div>'+
        '</div>';
      }).join("")+
    '</div>';
  }

  let content;
  if (step === 1){

          (isRej ? ' \u00b7 <span style="color:var(--bad)">'+f.reason+'</span>' : '')+'</div>'+

      '</div>'+
      (m.rejected.length&&m.rejected.length===m.files.length
        ? '<div class="banner banner-bad" style="margin-top:14px"><div class="grow"><b>None of these files could be parsed</b><p class="small" style="margin-top:2px">'+m.rejected.map(f=>f.reason).join("; ")+'</p>'+

  } else if (step === 2){
    if (m.locked.length && !m.schemes.length){

          '<button class="btn btn-primary" onclick="submitPwAndAdvance(\''+sc+'\')">Unlock & Continue</button></div>';
    } else if (feedDone || (pState && pState.complete)){

}, () => { dispatch({feedDone:true, step:4}); });

    if (!pState || !pState.files){

  function renderParsePhase(){

                (done ? '<div class="dc-overlay check-anim">\u2713</div>' : '')+
                '<div class="dc-head" style="background:'+(done?'var(--ok-bg)':'var(--warn-bg)')+'">'+
                  '<span class="chip chip-warn">balance</span><span class="grow" style="font-weight:600">'+s.name.split(" \u2013 ")[0]+'</span>'+
                  '<span class="chip chip-warn">'+u3(s.delta)+' units</span>'+
                  (done ? '<span class="chip chip-ok">resolved</span>' : '')+'</div>'+
                '<div class="dc-body">'+
                  '<p class="small" style="margin:0 0 6px">'+(it.w?it.w.text:'')+'</p>'+
                  '<p class="small muted" style="margin:0 0 8px">Statement says '+u3(s.close)+' units \u00b7 Our ledger has '+u3(s.derived)+' units</p>'+
                  (done ? '<div class="small" style="color:var(--ok)">'+labels[chosen]+' <button class="btn btn-sm btn-ghost" onclick="pick(\''+sc+'\',\'un-'+s.key+'\',\'\')">change</button></div>'
                  : '<div class="choices"><button class="choice" onclick="pick(\''+sc+'\',\'un-'+s.key+'\',\'trust-ledger\')">Trust our ledger</button>'+
                    '<button class="choice" onclick="pick(\''+sc+'\',\'un-'+s.key+'\',\'trust-statement\')">Trust the statement</button>'+
                    '<button class="choice" onclick="pick(\''+sc+'\',\'un-'+s.key+'\',\'exclude-scheme\')">Leave this Scheme out</button></div>')+
                '</div></div>';
            }
            if (it.type === "countGap"){
              return '<div class="decision-card-lg" style="border-color:var(--warn)"><div class="dc-head" style="background:var(--warn-bg)">'+
                '<span class="chip chip-warn">count gap</span><span class="grow" style="font-weight:600">Scheme count looks low</span>'+
                '<span class="chip chip-warn">'+m.countGap+' short</span></div>'+
                '<div class="dc-body"><p class="small muted" style="margin:0">Statement footer totals '+m.statementTotals.schemes+' Schemes; '+m.counts.parsedSchemes+' read.</p></div></div>';
            }
            return "";
          }).join(""))+
      '</div>';
  }

  return '<div class="wiz-layout">'+sidebar()+'<div class="wiz-content">'+content+'</div></div>';
}

/* ================================================================== *
 * Chrome, navigation, event wiring
 * ================================================================== */
let current = { variant: "C",
                scenario: new URLSearchParams(location.search).get("scenario") || "first-import" };

function setUrl(){
  const p = new URLSearchParams();
  p.set("scenario", current.scenario);
  history.replaceState(null,"","?"+p.toString());
}
function resetDecisions(){ Object.keys(DECISIONS).forEach(k=>delete DECISIONS[k]); render(); }
function pick(sc,k,v){
  if (DECISIONS[dk(sc,k)] === v) delete DECISIONS[dk(sc,k)];
  else if (v) DECISIONS[dk(sc,k)] = v;
  else delete DECISIONS[dk(sc,k)];
  render();
}
function submitPw(sc){
  if (DECISIONS[dk(sc,"pw")] === "wrong") DECISIONS[dk(sc,"pw")] = "ok";
  else DECISIONS[dk(sc,"pw")] = "wrong";
  render();
}
function submitPwAndAdvance(sc){
  submitPw(sc);
  if (DECISIONS[dk(sc,"pw")] === "ok"){
    setTimeout(() => advanceStep(sc), 300);
  }
}
function advanceStep(sc){
  const key = current.variant + "::" + sc;
  const cur = ASYNC[key] || {};
  dispatch({step: (cur.step || 1) + 1});
}
function doCommitC(sc){
  const m = model(sc);
  dispatch({showSheet:true, sheetPhase:"done",
    doneState:{txns:m.txnCount, schemes:m.schemes.length, openings:m.openingBalances.length, dups:m.duplicates.skipped},
    step:5});
}
function feedDismiss(sc){
  const key = current.variant + "::" + sc;
  const cur = ASYNC[key] || {};
  dispatch({feed:[...(cur.feed||[])],
    feedDone: cur.parseState ? cur.parseState.files.every(f=>f.status==="done"||f.status==="failed") : false});
}
function render(){
  const m = model(current.scenario);
  const app = document.getElementById("app");
  const focused = document.activeElement && document.activeElement.id;
  app.innerHTML = C(m);
  if (focused === "pw"){ const el = document.getElementById("pw"); if (el) el.focus(); }
  const sel = document.getElementById("scen");
  sel.value = current.scenario;
  const s = SCENARIOS[current.scenario];
  document.getElementById("scenhint").textContent = s.hint;
  setUrl();
}
const sel = document.getElementById("scen");
Object.entries(SCENARIOS).forEach(([k,v])=>{ const o=document.createElement("option"); o.value=k; o.textContent=v.label; sel.appendChild(o); });
sel.onchange = e => { current.scenario = e.target.value; render(); };
render();
</script>
