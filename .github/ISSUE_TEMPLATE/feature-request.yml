name: Feature Request
description: Suggest a new capability or change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What need does this address
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you envisage it working
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to ADRs, discussions, or related issues